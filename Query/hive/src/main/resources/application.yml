# 应用基本配置
spring:
  application:
    name: hive
  profiles:
    active: local  # 默认使用local配置

# 服务器配置
server:
  port: 8081
  servlet:
    jsp:
      registered: false

# 日志配置
logging:
  level:
    com.query.hive: debug
    org.apache.hive: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
